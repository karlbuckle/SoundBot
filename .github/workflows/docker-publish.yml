name: Build Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Two images: "latest" uses stock discord.py; "recording" is built with
    # ENABLE_RECORDING=true (the experimental voice-receive fork).
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: latest
            suffix: ""
            enable_recording: "false"
          - tag: recording
            suffix: "-recording"
            enable_recording: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            ENABLE_RECORDING=${{ matrix.enable_recording }}
          tags: |
            ghcr.io/karlbuckle/soundbot:${{ matrix.tag }}
            ghcr.io/karlbuckle/soundbot:${{ github.sha }}${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}
