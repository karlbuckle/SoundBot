services:
  soundboard:
    build:
      context: .
      args:
        ENABLE_RECORDING: ${ENABLE_RECORDING:-false}
    container_name: discord-soundboard
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      STATS_DATABASE: /data/stats.db
      CLIPS_DIRECTORY: /data/clips
    ports:
      - "${SOUNDBOARD_PORT:-8000}:8000"
    volumes:
      # Remove :ro to let "＋ Sounds" on the Clips page save clips into this folder.
      - ./sounds:/media/sounds:ro
      - soundboard-data:/data
      # Add more host folders here, then include their container paths in
      # AUDIO_DIRECTORIES. Example:
      # - /mnt/music/clips:/media/clips:ro

volumes:
  soundboard-data:
